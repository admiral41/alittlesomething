<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
/>

<title>A little something</title>

<style>
/* =========================================================
   RESET
========================================================= */

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html,
body {
  width: 100%;
  height: 100%;
  overflow: hidden;

  font-family:
    Inter,
    "Segoe UI",
    Arial,
    sans-serif;

  background: #07111c;
}

body {
  user-select: none;
}

button {
  font: inherit;
}


/* =========================================================
   START
========================================================= */

.start-screen {
  position: fixed;
  inset: 0;

  z-index: 99999;

  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;

  background:
    radial-gradient(
      circle at 50% 38%,
      #1d3248,
      #08111d 68%
    );

  transition:
    opacity 1s ease,
    visibility 1s ease;
}

.start-screen.hide {
  opacity: 0;
  visibility: hidden;
}

.start-screen h1 {
  margin-bottom: 28px;

  color: white;

  font-size:
    clamp(36px, 5vw, 64px);

  font-weight: 400;

  letter-spacing: -2px;
}

.open-btn {
  padding: 13px 32px;

  border:
    1px solid
    rgba(255,255,255,.2);

  border-radius: 999px;

  color: white;

  background:
    rgba(255,255,255,.08);

  backdrop-filter: blur(12px);

  cursor: pointer;

  transition: .25s ease;
}

.open-btn:hover {
  transform: translateY(-3px);

  background:
    rgba(255,255,255,.14);
}


/* =========================================================
   WORLD
========================================================= */

.world {
  position: relative;

  width: 100vw;
  height: 100vh;

  overflow: hidden;

  background: #07111c;
}


/* =========================================================
   CAPTION
========================================================= */

.caption {
  position: absolute;

  top: 6%;
  left: 50%;

  z-index: 9000;

  width:
    min(
      760px,
      calc(100% - 40px)
    );

  color:
    rgba(255,255,255,.95);

  text-align: center;

  font-size:
    clamp(18px, 2vw, 27px);

  font-weight: 300;

  text-shadow:
    0 4px 22px
    rgba(0,0,0,.65);

  opacity: 0;

  transform:
    translateX(-50%)
    translateY(10px);

  transition:
    opacity .65s ease,
    transform .65s ease;
}

.caption.show {
  opacity: 1;

  transform:
    translateX(-50%)
    translateY(0);
}


/* =========================================================
   LIGHTNING
========================================================= */

.flash {
  position: fixed;
  inset: 0;

  z-index: 9800;

  pointer-events: none;

  opacity: 0;

  background: #edf4ff;
}

.flash.active {
  animation:
    lightningFlash .65s ease;
}

@keyframes lightningFlash {

  0% {
    opacity: 0;
  }

  8% {
    opacity: .8;
  }

  18% {
    opacity: .07;
  }

  30% {
    opacity: .5;
  }

  43% {
    opacity: .03;
  }

  100% {
    opacity: 0;
  }

}


/* =========================================================
   ROOM
========================================================= */

.room {
  position: absolute;
  inset: 0;

  z-index: 100;

  overflow: hidden;

  background:
    linear-gradient(
      to bottom,
      #172638 0%,
      #1b293b 69%,
      #4a3225 69%,
      #332219 100%
    );

  transition:
    opacity 1.25s ease,
    transform 1.25s ease;
}

.room.hide {
  opacity: 0;

  transform: scale(1.03);

  pointer-events: none;
}


/* =========================================================
   WINDOW
========================================================= */

.window {
  position: absolute;

  left: 6%;
  top: 11%;

  width:
    min(
      35vw,
      450px
    );

  height:
    min(
      45vh,
      380px
    );

  overflow: hidden;

  border:
    10px solid #765840;

  border-radius: 17px;

  background: #07111d;

  box-shadow:
    0 25px 60px
    rgba(0,0,0,.35);
}

.window-sky {
  position: absolute;
  inset: 0;

  background:
    linear-gradient(
      to bottom,
      #06101c,
      #11273e 64%,
      #233e50
    );
}

.window-hill {
  position: absolute;

  left: -10%;
  bottom: -20px;

  z-index: 2;

  width: 120%;
  height: 38%;

  border-radius:
    50% 50% 0 0;

  background: #13251c;
}

.window-v {
  position: absolute;

  left: 50%;
  top: 0;
  bottom: 0;

  z-index: 20;

  width: 8px;

  transform:
    translateX(-50%);

  background: #765840;
}

.window-h {
  position: absolute;

  left: 0;
  right: 0;
  top: 50%;

  z-index: 20;

  height: 8px;

  transform:
    translateY(-50%);

  background: #765840;
}

#windowRain {
  position: absolute;
  inset: 0;

  z-index: 10;

  width: 100%;
  height: 100%;
}


/* =========================================================
   WORKSTATION
========================================================= */

.workstation {
  position: absolute;

  right: 4%;
  bottom: 1%;

  z-index: 50;

  width: 650px;
  height: 440px;
}


/* =========================================================
   CHAIR
   FIXED POSITION
========================================================= */

.chair {
  position: absolute;

  left: 58px;
  top: 128px;

  z-index: 8;

  width: 110px;
  height: 170px;
}

.chair-back {
  position: absolute;

  left: 12px;
  top: 0;

  width: 62px;
  height: 78px;

  border:
    3px solid #15191f;

  border-radius:
    14px 14px 8px 8px;

  background:
    linear-gradient(
      #303740,
      #20252c
    );
}

.chair-seat {
  position: absolute;

  left: 0;
  top: 76px;

  width: 98px;
  height: 16px;

  border:
    3px solid #15191f;

  border-radius: 8px;

  background: #20252c;
}

.chair-post {
  position: absolute;

  left: 44px;
  top: 90px;

  width: 6px;
  height: 48px;

  background: #171b20;
}

.chair-base {
  position: absolute;

  left: 12px;
  top: 136px;

  width: 70px;
  height: 6px;

  border-radius: 8px;

  background: #171b20;
}

.chair-base::before,
.chair-base::after {
  content: "";

  position: absolute;

  top: -2px;

  width: 10px;
  height: 10px;

  border-radius: 50%;

  background: #101419;
}

.chair-base::before {
  left: -3px;
}

.chair-base::after {
  right: -3px;
}


/* =========================================================
   COMMON GLASSES
========================================================= */

.glass {
  position: absolute;

  top: 0;

  width: 19px;
  height: 15px;

  border:
    3px solid #111;

  border-radius: 5px;
}

.glass.left {
  left: 0;
}

.glass.right {
  right: 0;
}

.bridge {
  position: absolute;

  left: 19px;
  top: 6px;

  width: 10px;
  height: 3px;

  background: #111;
}


/* =========================================================
   SEATED CHARACTER
========================================================= */

.seated-guy {
  position: absolute;

  left: 92px;
  top: 58px;

  z-index: 31;

  width: 140px;
  height: 285px;

  transition:
    opacity .4s ease;
}

.seated-guy.hide {
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
}


/* head */

.seated-head {
  position: absolute;

  left: 44px;
  top: 0;

  z-index: 8;

  width: 54px;
  height: 57px;

  border:
    4px solid #111;

  border-radius: 48%;

  background: #c99172;

  transition:
    transform .4s ease;
}

.seated-hair {
  position: absolute;

  left: 45px;
  top: -7px;

  z-index: 9;

  width: 46px;
  height: 17px;

  border-radius:
    70% 40% 30% 15%;

  background: #111;

  transform:
    rotate(-5deg);
}

.seated-glasses {
  position: absolute;

  left: 46px;
  top: 19px;

  z-index: 10;

  width: 49px;
  height: 19px;
}


/* body */

.seated-body {
  position: absolute;

  left: 43px;
  top: 54px;

  z-index: 6;

  width: 57px;
  height: 80px;

  border:
    3px solid #111;

  border-radius:
    12px 12px 8px 8px;

  background:
    linear-gradient(
      #465f79,
      #293e54
    );
}

.seated-body::before {
  content: "</>";

  position: absolute;

  left: 13px;
  top: 25px;

  color:
    rgba(255,255,255,.72);

  font-family: monospace;

  font-size: 13px;
}


/* arms */

.seated-arm {
  position: absolute;

  top: 69px;

  z-index: 7;

  width: 6px;
  height: 70px;

  border-radius: 7px;

  background: #111;

  transform-origin: top;
}

.seated-arm.left {
  left: 48px;

  transform:
    rotate(-63deg);
}

.seated-arm.right {
  left: 94px;

  transform:
    rotate(-47deg);
}

.seated-guy.typing
.seated-arm.left {
  animation:
    typingLeft .18s
    infinite alternate;
}

.seated-guy.typing
.seated-arm.right {
  animation:
    typingRight .21s
    infinite alternate;
}

@keyframes typingLeft {

  from {
    transform:
      rotate(-63deg);
  }

  to {
    transform:
      rotate(-59deg);
  }

}

@keyframes typingRight {

  from {
    transform:
      rotate(-47deg);
  }

  to {
    transform:
      rotate(-43deg);
  }

}


/* =========================================================
   CLEAN SITTING LEGS
   NO UGLY THIGH LINES
========================================================= */

.seated-thigh {
  display: none;
}


/*
   These start underneath the desk.
   Desk hides where they connect to the body.
*/

.seated-shin {
  position: absolute;

  z-index: 12;

  width: 7px;
  height: 55px;

  border-radius: 7px;

  background: #111;
}

.seated-shin.left {
  left: 86px;
  top: 160px;
}

.seated-shin.right {
  left: 104px;
  top: 160px;
}

.seated-shoe {
  position: absolute;

  z-index: 12;

  width: 24px;
  height: 8px;

  border-radius: 8px;

  background: #111;
}

.seated-shoe.left {
  left: 77px;
  top: 213px;
}

.seated-shoe.right {
  left: 95px;
  top: 213px;
}


/* =========================================================
   PHONE CHECK POSE
========================================================= */

.seated-guy.check-phone
.seated-head {
  transform:
    rotate(8deg)
    translateY(3px);
}

.seated-guy.check-phone
.seated-arm.left {
  animation: none;

  transform:
    rotate(-18deg);
}

.seated-guy.check-phone
.seated-arm.right {
  animation: none;

  transform:
    rotate(-12deg);
}


/* =========================================================
   LAPTOP
========================================================= */

.laptop-wrap {
  position: absolute;

  left: 232px;
  top: 75px;

  z-index: 46;

  width: 245px;
  height: 140px;

  perspective: 1000px;
}

.laptop {
  position: relative;

  width: 235px;
  height: 138px;

  transform:
    perspective(1000px)
    rotateY(43deg);

  transform-origin:
    left bottom;
}

.laptop-screen {
  position: absolute;

  left: 0;
  top: 0;

  width: 208px;
  height: 120px;

  border:
    8px solid #151a20;

  border-radius:
    10px 10px 5px 5px;

  background:
    linear-gradient(
      #111c28,
      #09121c
    );
}

.code {
  position: absolute;

  left: 16px;

  height: 5px;

  border-radius: 3px;

  background: #69b9d8;
}

.code.one {
  top: 20px;
  width: 80px;
}

.code.two {
  top: 34px;
  width: 125px;

  background: #68bd93;
}

.code.three {
  top: 48px;
  width: 96px;
}

.code.four {
  top: 62px;
  width: 137px;

  background: #dca66a;
}

.code.five {
  top: 76px;
  width: 68px;
}

.code.six {
  top: 90px;
  width: 111px;

  background: #8c83c7;
}

.cursor {
  position: absolute;

  left: 126px;
  top: 88px;

  width: 2px;
  height: 10px;

  background: white;

  animation:
    cursorBlink .8s
    steps(1)
    infinite;
}

@keyframes cursorBlink {

  50% {
    opacity: 0;
  }

}

.laptop-base {
  position: absolute;

  left: -11px;
  top: 116px;

  width: 228px;
  height: 13px;

  border-radius:
    2px 2px 12px 12px;

  background: #292f36;
}


/* =========================================================
   PHONE
========================================================= */

.phone {
  position: absolute;

  left: 505px;
  top: 151px;

  z-index: 72;

  width: 31px;
  height: 55px;

  border:
    4px solid #101318;

  border-radius: 8px;

  background:
    linear-gradient(
      #1c2737,
      #10161f
    );

  transform:
    rotate(8deg);

  transition:
    left .5s ease,
    top .5s ease,
    transform .5s ease;
}

.phone::before {
  content: "";

  position: absolute;

  left: 7px;
  top: 2px;

  width: 10px;
  height: 2px;

  border-radius: 4px;

  background:
    rgba(255,255,255,.3);
}

.phone.vibrate {
  animation:
    phoneVibrate .11s linear
    7;
}

@keyframes phoneVibrate {

  0% {
    transform:
      rotate(8deg)
      translateX(0);
  }

  30% {
    transform:
      rotate(5deg)
      translateX(-2px);
  }

  70% {
    transform:
      rotate(11deg)
      translateX(2px);
  }

  100% {
    transform:
      rotate(8deg);
  }

}

.phone.in-hand {
  left: 180px;
  top: 136px;

  transform:
    rotate(-10deg)
    scale(1.07);
}


/*
   Gone permanently after desk scene.
*/

.phone.gone {
  display: none !important;
}


/* =========================================================
   NOTIFICATION
========================================================= */

.notification {
  position: absolute;

  left: 120px;
  top: 2px;

  z-index: 180;

  width: 285px;

  padding:
    14px 17px;

  border-radius: 18px;

  background:
    rgba(247,250,255,.96);

  color: #202630;

  box-shadow:
    0 18px 48px
    rgba(0,0,0,.25);

  opacity: 0;

  transform:
    translateY(10px)
    scale(.95);

  transition:
    opacity .45s ease,
    transform .45s ease;
}

.notification.show {
  opacity: 1;

  transform:
    translateY(0)
    scale(1);
}

.notification strong {
  display: block;

  margin-bottom: 4px;

  font-size: 14px;
}

.notification span {
  color: #606772;

  font-size: 13px;
}


/* =========================================================
   DESK

   Desk hides top of lower legs naturally.
========================================================= */

.desk-top {
  position: absolute;

  left: 20px;
  top: 206px;

  z-index: 40;

  width: 610px;
  height: 20px;

  border-radius: 9px;

  background:
    linear-gradient(
      #966b4b,
      #60422f
    );

  box-shadow:
    0 12px 25px
    rgba(0,0,0,.25);
}

.desk-leg {
  position: absolute;

  top: 224px;

  z-index: 14;

  width: 18px;
  height: 190px;

  background: #4a3225;
}

.desk-leg.left {
  left: 65px;
}

.desk-leg.right {
  right: 45px;
}


/* =========================================================
   IDEA BULB

   No flower / rose clue.
========================================================= */

.idea-bulb {
  position: absolute;

  right: 23%;
  top: 18%;

  z-index: 350;

  width: 60px;
  height: 65px;

  opacity: 0;

  transform:
    scale(.35)
    rotate(-15deg);

  transition:
    opacity .35s ease,
    transform .5s
    cubic-bezier(
      .2,
      1.6,
      .4,
      1
    );
}

.idea-bulb.show {
  opacity: 1;

  transform:
    scale(1)
    rotate(0);
}

.bulb-circle {
  position: absolute;

  left: 7px;
  top: 0;

  width: 45px;
  height: 45px;

  border-radius: 50%;

  background:
    radial-gradient(
      circle at 38% 28%,
      white,
      #ffe55d 52%,
      #f5b52a
    );

  box-shadow:
    0 0 28px
    rgba(255,221,64,.9);

  animation:
    bulbPulse .7s
    infinite alternate;
}

.bulb-circle::after {
  content: "";

  position: absolute;

  left: 15px;
  bottom: -10px;

  width: 15px;
  height: 12px;

  border-radius:
    2px 2px 5px 5px;

  background: #777;
}

@keyframes bulbPulse {

  to {
    box-shadow:
      0 0 40px
      rgba(255,221,64,1);
  }

}


/* =========================================================
   THOUGHT
========================================================= */

.thought {
  position: absolute;

  right: 18%;
  top: 13%;

  z-index: 400;

  width:
    min(
      280px,
      31vw
    );

  padding:
    18px 21px;

  border-radius: 25px;

  background:
    rgba(255,255,255,.96);

  color: #252b32;

  text-align: center;

  font-size:
    clamp(14px, 1.2vw, 17px);

  line-height: 1.45;

  box-shadow:
    0 18px 50px
    rgba(0,0,0,.24);

  opacity: 0;

  transform:
    scale(.94)
    translateY(10px);

  transition:
    opacity .5s ease,
    transform .5s ease,
    left .6s ease,
    right .6s ease;
}

.thought.show {
  opacity: 1;

  transform:
    scale(1)
    translateY(0);
}

.thought.window-position {
  left: 24%;
  right: auto;
}

.thought.sad {
  background: #edf2f6;

  color: #3d4954;
}

.thought::before {
  content: "";

  position: absolute;

  left: 31px;
  bottom: -17px;

  width: 16px;
  height: 16px;

  border-radius: 50%;

  background: inherit;
}

.thought::after {
  content: "";

  position: absolute;

  left: 17px;
  bottom: -31px;

  width: 9px;
  height: 9px;

  border-radius: 50%;

  background: inherit;
}


/* =========================================================
   ROOM WALKER
   Separate from seated character.
========================================================= */

.room-walker {
  position: absolute;

  right: 20%;
  bottom: 17%;

  z-index: 120;

  width: 120px;
  height: 220px;

  opacity: 0;

  pointer-events: none;

  transition:
    left 1.9s linear,
    right 1.9s linear,
    opacity .4s ease,
    transform .5s ease;
}

.room-walker.show {
  opacity: 1;
}

.room-walker.to-window {
  right: auto;

  left: 26%;
}

.room-walker.at-window {
  right: auto;

  left: 26%;

  transform:
    rotate(-4deg);
}


/* room head */

.room-head {
  position: absolute;

  left: 35px;
  top: 0;

  width: 50px;
  height: 52px;

  border:
    4px solid #111;

  border-radius: 50%;

  background: #c99172;
}

.room-hair {
  position: absolute;

  left: 36px;
  top: -5px;

  width: 41px;
  height: 15px;

  border-radius:
    70% 40% 25% 15%;

  background: #111;
}

.room-glasses {
  position: absolute;

  left: 37px;
  top: 18px;

  width: 45px;
  height: 18px;
}

.room-glasses
.glass {
  width: 17px;
  height: 14px;
}


/* room body */

.room-body {
  position: absolute;

  left: 37px;
  top: 51px;

  width: 46px;
  height: 78px;

  border:
    4px solid #111;

  border-radius:
    11px 11px 7px 7px;

  background:
    linear-gradient(
      #425975,
      #293c52
    );
}

.room-body::before {
  content: "</>";

  position: absolute;

  left: 8px;
  top: 25px;

  color:
    rgba(255,255,255,.7);

  font-family: monospace;

  font-size: 11px;
}


/* room arms */

.room-arm {
  position: absolute;

  top: 62px;

  width: 6px;
  height: 62px;

  border-radius: 7px;

  background: #111;

  transform-origin: top;
}

.room-arm.left {
  left: 40px;

  transform:
    rotate(32deg);
}

.room-arm.right {
  left: 79px;

  transform:
    rotate(-32deg);
}


/* room legs */

.room-leg {
  position: absolute;

  top: 126px;

  width: 7px;
  height: 77px;

  border-radius: 7px;

  background: #111;

  transform-origin: top;
}

.room-leg.left {
  left: 52px;

  transform:
    rotate(6deg);
}

.room-leg.right {
  left: 69px;

  transform:
    rotate(-6deg);
}

.room-shoe {
  position: absolute;

  top: 199px;

  width: 27px;
  height: 8px;

  border-radius: 8px;

  background: #111;
}

.room-shoe.left {
  left: 46px;
}

.room-shoe.right {
  left: 65px;
}


/* walking */

.room-walker.walking
.room-leg.left {
  animation:
    roomLegLeft .42s
    infinite alternate;
}

.room-walker.walking
.room-leg.right {
  animation:
    roomLegRight .42s
    infinite alternate;
}

.room-walker.walking
.room-arm.left {
  animation:
    roomArmLeft .42s
    infinite alternate;
}

.room-walker.walking
.room-arm.right {
  animation:
    roomArmRight .42s
    infinite alternate;
}

.room-walker.walking {
  animation:
    roomBob .42s
    infinite alternate;
}

@keyframes roomLegLeft {

  from {
    transform:
      rotate(25deg);
  }

  to {
    transform:
      rotate(-22deg);
  }

}

@keyframes roomLegRight {

@keyframes roomArmLeft {

  from {
    transform:
      rotate(-22deg);
  }

  to {
    transform:
      rotate(28deg);

}

@keyframes roomArmRight {

  from {
    transform:
      rotate(22deg);
  }

  to {
    transform:

}

@keyframes roomBob {

/* =========================================================
   OUTSIDE
========================================================= */

.outside {
  position: absolute;
  inset: 0;

  z-index: 500;

  overflow: hidden;

  pointer-events: none;

  opacity: 0;

  background:
    linear-gradient(
      to bottom,
      #07111d 0%,
      #10263b 54%,
      #21372c 100%
    );

  transition:
    opacity 1.4s ease,
    background 4s ease;
}

.outside.show {
  opacity: 1;

  pointer-events: auto;
}

.outside.clear {
  background:
    linear-gradient(
      to bottom,
      #20364b,
      #6a5868 46%,
      #c88172 70%,
      #405b40
    );
}

#outsideRain {
  position: absolute;
  inset: 0;

  z-index: 180;

  width: 100%;
  height: 100%;

  pointer-events: none;

  transition:
    opacity 3s ease;
}

.outside.clear
#outsideRain {
  opacity: 0;
}


/* =========================================================
   CLOUDS
========================================================= */

.cloud {
  position: absolute;

  width: 220px;
  height: 62px;

  border-radius: 999px;

  background: #121d29;

  opacity: .87;
}

.cloud::before,
.cloud::after {
  content: "";

  position: absolute;

  border-radius: 50%;

  background: inherit;
}

.cloud::before {
  left: 28px;
  top: -47px;

  width: 100px;
  height: 100px;
}

.cloud::after {
  right: 18px;
  top: -63px;

  width: 125px;
  height: 125px;
}

.cloud.one {
  top: 12%;
  left: -250px;

  animation:
    cloudOne 30s
    linear infinite;
}

.cloud.two {
  top: 7%;
  left: 58%;

  transform: scale(.8);

  animation:
    cloudTwo 35s
    linear infinite;
}

.cloud.three {
  top: 25%;
  left: 17%;

  transform: scale(.65);

  animation:
    cloudThree 40s
    linear infinite;
}

@keyframes cloudOne {

  to {
    left: 110%;
  }

}

@keyframes cloudTwo {

  to {
    left: -300px;
  }

}

@keyframes cloudThree {

  to {
    left: 105%;
  }

}

.outside.clear
.cloud {
  opacity: .12;
}


/* =========================================================
   LAND
========================================================= */

.far-hill {
  position: absolute;

  left: -10%;
  bottom: 20%;

  width: 120%;
  height: 28%;

  border-radius:
    50% 50% 0 0;

  background: #101e20;

  opacity: .76;
}

.near-hill {
  position: absolute;

  left: -10%;
  bottom: 13%;

  width: 120%;
  height: 22%;

  border-radius:
    50% 50% 0 0;

  background: #14291f;
}

.ground {
  position: absolute;

  left: -5%;
  bottom: -9%;

  z-index: 5;

  width: 110%;
  height: 31%;

  border-radius:
    48% 48% 0 0;

  background:
    linear-gradient(
      #203729,
      #0c1e15
    );
}


/* =========================================================
   ROAD
========================================================= */

.road {
  position: absolute;

  left: 0;
  right: 0;

  bottom: 12vh;

  z-index: 15;

  height: 66px;

  background:
    linear-gradient(
      #41484e,
      #292e33
    );
}

.road::before {
  content: "";

  position: absolute;

  left: 0;
  right: 0;
  top: 50%;

  height: 2px;

  background:
    repeating-linear-gradient(
      to right,
      rgba(255,255,255,.18)
      0 47px,
      transparent
      47px 87px
    );
}


/* =========================================================
   PUDDLE
========================================================= */

.puddle {
  position: absolute;

  left: 34%;
  bottom:
    calc(
      12vh + 6px
    );

  z-index: 18;

  width: 190px;
  height: 28px;

  border-radius: 50%;

  background:
    radial-gradient(
      ellipse,
      rgba(142,196,227,.48),
      rgba(58,105,140,.13)
    );
}

.puddle::before {
  content: "";

  position: absolute;

  left: 45px;
  top: 8px;

  width: 90px;
  height: 2px;

  border-radius: 100%;

  background:
    rgba(255,255,255,.22);
}


/* =========================================================
   SPLASH
========================================================= */

.splash {
  position: absolute;

  left: 37%;
  bottom:
    calc(
      12vh + 13px
    );

  z-index: 270;

  width: 115px;
  height: 75px;

  opacity: 0;
}

.splash.active {
  animation:
    splashAnimation .85s ease;
}

.drop {
  position: absolute;

  bottom: 0;

  width: 10px;
  height: 21px;

  border-radius: 50%;

  background:
    rgba(146,203,233,.7);
}

.drop:nth-child(1) {
  left: 5px;
}

.drop:nth-child(2) {
  left: 35px;
}

.drop:nth-child(3) {
  left: 68px;
}

.drop:nth-child(4) {
  left: 98px;
}

@keyframes splashAnimation {

  0% {
    opacity: 0;

    transform:
      scale(.3);
  }

  20% {
    opacity: 1;
  }

  65% {
    transform:
      translateY(-28px)
      scale(1.4);
  }

  100% {
    opacity: 0;

    transform:
      translateY(-42px)
      scale(1.6);
  }

}


/* =========================================================
   CRACK
========================================================= */

.crack {
  position: absolute;

  left: 39%;
  bottom:
    calc(
      12vh + 108px
    );

  z-index: 650;

  padding:
    8px 15px;

  border:
    3px solid #6d1d1d;

  border-radius: 11px;

  color: white;

  background: #d94b4b;

  font-family:
    "Arial Black",
    Arial;

  font-size:
    clamp(19px, 2.3vw, 31px);

  opacity: 0;

  transform:
    rotate(-8deg)
    scale(.3);
}

.crack.show {
  animation:
    crackPop .9s ease;
}

@keyframes crackPop {

  0% {
    opacity: 0;

    transform:
      rotate(-8deg)
      scale(.3);
  }

  35% {
    opacity: 1;

    transform:
      rotate(8deg)
      scale(1.2);
  }

  75% {
    opacity: 1;

    transform:
      rotate(-5deg)
      scale(1);
  }

  100% {
    opacity: 0;
  }

}


/* =========================================================
   OUTDOOR CHARACTER
========================================================= */

.walker {
  position: absolute;

  left: -170px;

  bottom:
    calc(
      12vh + 39px
    );

  z-index: 260;

  width: 120px;
  height: 205px;

  transition:
    left 4s linear,
    bottom 1.4s ease,
    opacity 1s ease;
}

.walker.to-puddle {
  left: 32%;
}

.walker.after-puddle {
  left: 47%;
}

.walker.to-farm {
  left: 61%;
}

.walker.at-rose {
  left: 74%;
}

.walker.return {
  left:
    calc(
      50% - 60px
    );

  bottom: 13vh;
}

.walker-rig {
  position: absolute;
  inset: 0;

  transform-origin:
    bottom center;

  transition:
    transform .7s ease;
}


/* head */

.walker-head {
  position: absolute;

  left: 35px;
  top: 2px;

  width: 49px;
  height: 51px;

  border:
    4px solid #111;

  border-radius: 50%;

  background: #c99172;
}

.walker-hair {
  position: absolute;

  left: 36px;
  top: -4px;

  width: 40px;
  height: 15px;

  border-radius:
    70% 40% 25% 15%;

  background: #111;
}

.walker-glasses {
  position: absolute;

  left: 37px;
  top: 20px;

  width: 45px;
  height: 18px;
}

.walker-glasses
.glass {
  width: 17px;
  height: 14px;
}


/* body */

.walker-body {
  position: absolute;

  left: 37px;
  top: 51px;

  width: 46px;
  height: 77px;

  border:
    4px solid #111;

  border-radius:
    11px 11px 7px 7px;

  background:
    linear-gradient(
      #425975,
      #293c52
    );
}

.walker-body::before {
  content: "</>";

  position: absolute;

  left: 8px;
  top: 25px;

  color:
    rgba(255,255,255,.7);

  font-family: monospace;

  font-size: 11px;
}


/* arms */

.walk-arm {
  position: absolute;

  top: 62px;

  width: 6px;
  height: 61px;

  border-radius: 7px;

  background: #111;

  transform-origin: top;
}

.walk-arm.left {
  left: 40px;

  transform:
    rotate(38deg);
}

.walk-arm.right {
  left: 79px;

  height: 56px;

  transform:
    rotate(-7deg);
}

.umbrella-hand {
  position: absolute;

  left: 75px;
  top: 111px;

  z-index: 35;

  width: 13px;
  height: 13px;

  border:
    3px solid #111;

  border-radius: 50%;

  background: #c99172;
}


/* =========================================================
   LEGS
========================================================= */

.walk-leg {
  position: absolute;

  top: 124px;
  left: 58px;

  width: 6px;
  height: 70px;

  border-radius: 7px;

  background: #111;

  transform-origin: top;

  overflow: visible;
}

.walk-leg.left {
  transform:
    rotate(25deg);
}

.walk-leg.right {
  transform:
    rotate(-25deg);
}


/* =========================================================
   BANDAGE
   INSIDE THE LEG = NO FLOATING WHITE RECTANGLE
========================================================= */

.bandage {
  position: absolute;

  left: -5px;
  top: 28px;

  z-index: 5;

  width: 16px;
  height: 23px;

  border:
    1px solid #c8c5bb;

  border-radius: 4px;

  background:
    repeating-linear-gradient(
      45deg,
      #f2efe6 0 4px,
      #d9d6cc 4px 7px
    );

  opacity: 0;

  visibility: hidden;

  pointer-events: none;
}

.walker-rig.injured
.walk-leg.left
.bandage {
  opacity: 1;

  visibility: visible;
}


/* =========================================================
   NORMAL WALK
========================================================= */

.walker-rig.walking:not(.injured)
.walk-leg.left {
  animation:
    walkLegLeft .4s
    infinite alternate;
}

.walker-rig.walking:not(.injured)
.walk-leg.right {
  animation:
    walkLegRight .4s
    infinite alternate;
}

.walker-rig.walking:not(.injured)
.walk-arm.left {
  animation:
    walkArm .4s
    infinite alternate;
}

.walker-rig.walking:not(.injured) {
  animation:
    walkBob .4s
    infinite alternate;
}

@keyframes walkLegLeft {

  from {
    transform:
      rotate(30deg);
  }

  to {
    transform:
      rotate(-28deg);
  }

}

@keyframes walkLegRight {

  from {
    transform:
      rotate(-30deg);
  }

  to {
    transform:
      rotate(28deg);
  }

}

@keyframes walkArm {

  from {
    transform:
      rotate(40deg);
  }

  to {
    transform:
      rotate(-28deg);
  }

}

@keyframes walkBob {

  to {
    translate:
      0 -3px;
  }

}


/* =========================================================
   UMBRELLA
========================================================= */

.umbrella {
  position: absolute;

  left: 12px;
  top: -67px;

  z-index: -1;

  width: 145px;
  height: 190px;
}

.umbrella-top {
  position: absolute;

  left: 0;
  top: 0;

  width: 145px;
  height: 73px;

  overflow: hidden;
}

.umbrella-canopy {
  position: absolute;

  left: 0;
  top: 14px;

  width: 145px;
  height: 125px;

  border:
    3px solid #1b2835;

  border-radius:
    50% 50% 0 0;

  background:
    radial-gradient(
      circle at 50% 20%,
      #758fa9,
      #425a72 65%,
      #2b4054
    );
}

.umbrella-canopy::before {
  content: "";

  position: absolute;

  left: 48px;
  top: -2px;

  width: 46px;
  height: 66px;

  border-left:
    1px solid
    rgba(255,255,255,.15);

  border-right:
    1px solid
    rgba(0,0,0,.18);

  border-radius: 50%;
}

.umbrella-stick {
  position: absolute;

  left: 67px;
  top: 62px;

  width: 4px;
  height: 108px;

  border-radius: 5px;

  background: #1b2026;
}

.umbrella-stick::after {
  content: "";

  position: absolute;

  left: -12px;
  bottom: -4px;

  width: 16px;
  height: 19px;

  border:
    4px solid #1b2026;

  border-top: none;
  border-right: none;

  border-radius:
    0 0 0 14px;
}


/* =========================================================
   FALL
========================================================= */

.walker-rig.slipping {
  animation:
    slipFall 1.2s ease
    forwards;
}

@keyframes slipFall {

  0% {
    transform:
      rotate(0)
      translateY(0);
  }

  20% {
    transform:
      rotate(-20deg)
      translateY(-5px);
  }

  42% {
    transform:
      rotate(28deg)
      translateY(8px);
  }

  68% {
    transform:
      rotate(63deg)
      translateY(35px);
  }

  100% {
    transform:
      rotate(76deg)
      translateY(54px);
  }

}


/* =========================================================
   GET UP
========================================================= */

.walker-rig.getting-up {
  animation:
    getUp 1.4s ease
    forwards;
}

@keyframes getUp {

  from {
    transform:
      rotate(76deg)
      translateY(54px);
  }

  55% {
    transform:
      rotate(18deg)
      translateY(12px);
  }

  to {
    transform:
      rotate(0)
      translateY(0);
  }

}


/* =========================================================
   LIMP
========================================================= */

.walker-rig.injured
.walk-leg.left {
  transform:
    rotate(34deg)
    translateY(3px);
}

.walker-rig.injured.walking {
  animation:
    limpBody .72s
    infinite;
}

.walker-rig.injured.walking
.walk-leg.left {
  animation:
    injuredLeg .72s
    infinite;
}

.walker-rig.injured.walking
.walk-leg.right {
  animation:
    healthyLeg .72s
    infinite;
}

.walker-rig.injured.walking
.walk-arm.left {
  animation:
    limpArm .72s
    infinite;
}

@keyframes limpBody {

  0%,
  100% {
    transform:
      rotate(0)
      translateY(0);
  }

  35% {
    transform:
      rotate(-6deg)
      translateY(5px);
  }

  65% {
    transform:
      rotate(3deg)
      translateY(-2px);
  }

}

@keyframes injuredLeg {

  0%,
  100% {
    transform:
      rotate(34deg)
      translateY(3px);
  }

  45% {
    transform:
      rotate(28deg)
      translateY(7px);
  }

  70% {
    transform:
      rotate(38deg)
      translateY(4px);
  }

}

@keyframes healthyLeg {

  0% {
    transform:
      rotate(-25deg);
  }

  50% {
    transform:
      rotate(31deg);
  }

  100% {
    transform:
      rotate(-25deg);
  }

}

@keyframes limpArm {

  0%,
  100% {
    transform:
      rotate(30deg);
  }

  50% {
    transform:
      rotate(-16deg);
  }

}


/* =========================================================
   FARM
========================================================= */

.farm {
  position: absolute;

  right: -3%;
  bottom: 19vh;

  z-index: 55;

  width: 44vw;

  min-width: 450px;

  height: 31vh;

  opacity: 0;

  transform:
    translateX(190px);

  transition:
    opacity 1.5s ease,

  opacity: 1;

  transform:
    translateX(0);
}

.farm-ground {

  inset:

  border-radius:

    linear-gradient(
      #375239,
      #1c3022
    );

========================================================= */

.farm-sign {

  top: -12px;

  opacity: 0;

  transform:
    rotate(-5deg)

}

.farm-sign.show {

  transform:
    rotate(-5deg)

.sign-post {

/* =========================================================
   FLOWER ROWS
========================================================= */

.flower-row {
  position: absolute;

  left: 7%;
  right: 5%;

  height: 72px;

  opacity: 0;

  transform:
    translateY(18px);

    opacity 1s ease,

}

  transform:
    translateY(0);

}

.row2 {

}

.row3 {

   ROSE
========================================================= */

.rose {
  position: absolute;

  height: 78px;

  transform-origin:
    bottom center;

  animation:
    roseSway 2.1s

@keyframes roseSway {

    rotate: -3deg;
  }

  to {
    rotate: 4deg;
  }

}

.rose-stem {
  position: absolute;

  left: 19px;
  bottom: 0;

  width: 3px;
  height: 53px;

  border-radius: 5px;

  background:
    linear-gradient(
      #59a260,
      #2b6338
    );
}

.rose-leaf {
  position: absolute;

  left: 19px;
  bottom: 23px;

  width: 21px;
  height: 11px;

  border-radius:
    100% 0 100% 0;

  background: #58a461;

  transform:
    rotate(-25deg);
}

.rose-head {
  position: absolute;

  left: 0;
  top: 0;

  width: 39px;
  height: 39px;
}

  top: 5px;

  width: 26px;
  height: 29px;

  transform-origin:
    50% 72%;

      #b11336 76%,
      #861029
    );

.petal:nth-child(1) {

}

.petal:nth-child(2) {

}

.petal:nth-child(3) {

}

.petal:nth-child(4) {
  transform: rotate(180deg);
}

.petal:nth-child(5) {

}

.petal:nth-child(6) {

.rose-head::after {

.special-rose {

.post {

    );

.held-leaf {

  bottom: 34px;

  width: 28px;

  border-radius:

.held-head {

  top: 0;

.held-petal {

  top: 5px;

  height: 42px;

  border-radius:

  transform-origin:
    50% 72%;

  background:

function wait(ms) {

    resolve =>

        resolve,
        ms

/* =========================================================
   VISUAL RAIN
========================================================= */

function createRain(
  id,
  density = 1
) {

  const canvas =
    document.getElementById(
      id
    );


  const context =
    canvas.getContext(
      "2d"
    );


  let active =
    true;


  let drops =
    [];


  function resize() {

    const rect =
      canvas.parentElement
        .getBoundingClientRect();


    canvas.width =
      rect.width;


    canvas.height =
      rect.height;


    createDrops();

  }


  function createDrops() {

    drops = [];


    const count =
      Math.max(
        60,
        Math.floor(
          canvas.width /
          5 *
          density
        )
      );


    for (
      let i = 0;
      i < count;
      i++
    ) {

      drops.push({

        x:
          Math.random() *
          canvas.width,

        y:
          Math.random() *
          canvas.height,

        length:
          10 +
          Math.random() *
          18,

        speed:
          9 +
          Math.random() *
          10,

        opacity:
          .1 +
          Math.random() *
          .35

      });

    }

  }


  function animate() {

    context.clearRect(
      0,
      0,
      canvas.width,
      canvas.height
    );


    if (active) {

      drops.forEach(
        drop => {

          context.beginPath();


          context.moveTo(
            drop.x,
            drop.y
          );


          context.lineTo(
            drop.x - 6,
            drop.y +
            drop.length
          );


          context.strokeStyle =
            `rgba(
              195,
              223,
              255,
              ${drop.opacity}
            )`;


          context.lineWidth =
            1;


          context.stroke();


          drop.x -=
            1.3;


          drop.y +=
            drop.speed;


          if (
            drop.y >
            canvas.height +
            30
          ) {

            drop.y =
              -30;


            drop.x =
              Math.random() *
              canvas.width;

          }

        }
      );

    }


    requestAnimationFrame(
      animate
    );

  }


  resize();

  animate();


  window.addEventListener(
    "resize",
    resize
  );


  return {

    stop() {
      active = false;
    },

    start() {
      active = true;
    }

  };

}

let audioContext =
  null;

let typingTimer =
  null;

let walkingTimer =
  null;

  null;

let rainGain =
  null;

let stormTimer =
  null;

let stormActive =

/* =========================================================
   AUDIO INIT
========================================================= */

function initAudio() {

  audioContext =
    new (
      window.AudioContext ||
      window.webkitAudioContext
    )();

}


/* =========================================================
   KEYBOARD
========================================================= */

function keyboardSound() {

  if (!audioContext)
    return;


  const oscillator =
    audioContext
      .createOscillator();


  const gain =
    audioContext
      .createGain();


  oscillator.type =
    "square";


  oscillator.frequency.value =
    120 +
    Math.random() *
    80;


  gain.gain.setValueAtTime(
    .012,
    audioContext.currentTime
  );


  gain.gain.exponentialRampToValueAtTime(
    .001,
    audioContext.currentTime +
    .025
  );


  oscillator.connect(
    gain
  );


  gain.connect(
    audioContext.destination
  );


  oscillator.start();


  oscillator.stop(
    audioContext.currentTime +
    .03
  );

}


function startTyping() {

  if (typingTimer)
    return;


  typingTimer =
    setInterval(
      keyboardSound,
      120
    );

}


function stopTyping() {

  clearInterval(
    typingTimer
  );


  typingTimer =
    null;

}


/* =========================================================
   MESSAGE SOUND
========================================================= */

function messageSound() {

  if (!audioContext)
    return;


  [
    740,
    990
  ].forEach(
    (
      frequency,
      index
    ) => {

      const oscillator =
        audioContext
          .createOscillator();


      const gain =
        audioContext
          .createGain();


      const start =
        audioContext.currentTime +
        index *
        .09;


      oscillator.type =
        "sine";


      oscillator.frequency.value =
        frequency;


      gain.gain.setValueAtTime(
        .001,
        start
      );


      gain.gain.exponentialRampToValueAtTime(
        .07,
        start +
        .02
      );


      gain.gain.exponentialRampToValueAtTime(
        .001,
        start +
        .22
      );


      oscillator.connect(
        gain
      );


      gain.connect(
        audioContext.destination
      );


      oscillator.start(
        start
      );


      oscillator.stop(
        start +
        .25
      );

    }
  );

}


/* =========================================================
   THUNDER
========================================================= */

function thunderSound() {

  if (!audioContext)
    return;


  const duration =
    2;


  const buffer =
    audioContext.createBuffer(
      1,
      audioContext.sampleRate *
      duration,
      audioContext.sampleRate
    );


  const data =
    buffer.getChannelData(
      0
    );


  for (
    let i = 0;
    i < data.length;
    i++
  ) {

    const progress =
      i /
      data.length;


    data[i] =
      (
        Math.random() *
        2 -
        1
      ) *
      Math.pow(
        1 -
        progress,
        2.3
      );

  }


  const source =
    audioContext
      .createBufferSource();


  const filter =
    audioContext
      .createBiquadFilter();


  const gain =
    audioContext
      .createGain();


  source.buffer =
    buffer;


  filter.type =
    "lowpass";


  filter.frequency.value =
    175;


  gain.gain.setValueAtTime(
    .58,
    audioContext.currentTime
  );


  gain.gain.exponentialRampToValueAtTime(
    .001,
    audioContext.currentTime +
    duration
  );


  source.connect(
    filter
  );


  filter.connect(
    gain
  );


  gain.connect(
    audioContext.destination
  );


  source.start();

}


function lightning() {

  flash.classList.remove(

/* =========================================================
   RAIN AUDIO
========================================================= */

function startRainAmbience() {

  if (
    !audioContext ||
    rainSource
  ) {
    return;
  }


  const buffer =
    audioContext.createBuffer(
      1,
      audioContext.sampleRate *
      2,
      audioContext.sampleRate
    );


  const data =
    buffer.getChannelData(
      0
    );


  for (
    let i = 0;
    i < data.length;
    i++
  ) {

    data[i] =
      (
        Math.random() *
        2 -
        1
      ) *
      .33;

  }


  rainSource =
    audioContext
      .createBufferSource();


  const highPass =
    audioContext
      .createBiquadFilter();


  const lowPass =
    audioContext
      .createBiquadFilter();


  rainGain =
    audioContext
      .createGain();


  rainSource.buffer =
    buffer;


  rainSource.loop =
    true;


  highPass.type =
    "highpass";


  highPass.frequency.value =
    350;


  lowPass.type =
    "lowpass";


  lowPass.frequency.value =
    2600;


  rainGain.gain.setValueAtTime(
    .001,
    audioContext.currentTime
  );


  rainGain.gain.linearRampToValueAtTime(
    .065,
    audioContext.currentTime +
    .8
  );


  rainSource.connect(
    highPass
  );


  highPass.connect(
    lowPass
  );


  lowPass.connect(
    rainGain
  );


  rainGain.connect(
    audioContext.destination
  );


  rainSource.start();

}


function stopRainAmbience() {

  if (
    !rainSource ||
    !rainGain ||
    !audioContext
  ) {
    return;
  }


  const oldSource =
    rainSource;


  const oldGain =
    rainGain;


  const now =
    audioContext.currentTime;


  oldGain.gain.cancelScheduledValues(
    now
  );


  oldGain.gain.setValueAtTime(
    Math.max(
      oldGain.gain.value,
      .01
    ),
    now
  );


  oldGain.gain.exponentialRampToValueAtTime(
    .001,
    now +
    1
  );


  setTimeout(
    () => {

      try {
        oldSource.stop();
      }
      catch {}

    },
    1100
  );


  rainSource =
    null;


  rainGain =
    null;

}


/* =========================================================
   RANDOM STORM
========================================================= */

function scheduleThunder() {

  if (!stormActive)
    return;


  const delay =
    4000 +
    Math.random() *
    5000;


  stormTimer =
    setTimeout(
      () => {

        if (!stormActive)
          return;


        lightning();


        scheduleThunder();

      },
      delay
    );

}


function startStorm() {

  if (stormActive)
    return;


  stormActive =
    true;


  startRainAmbience();


  scheduleThunder();

}


function stopStorm() {

  stormActive =
    false;


  if (stormTimer) {

    clearTimeout(
      stormTimer
    );


    stormTimer =
      null;

  }


  stopRainAmbience();

}


/* =========================================================
   IDEA CHIME
========================================================= */

function chime() {

  if (!audioContext)
    return;


  [
    392,
    523,
    659
  ].forEach(
    (
      frequency,
      index
    ) => {

      const oscillator =
        audioContext
          .createOscillator();


      const gain =
        audioContext
          .createGain();


      const start =
        audioContext.currentTime +
        index *
        .1;


      oscillator.type =
        "sine";


      oscillator.frequency.value =
        frequency;


      gain.gain.setValueAtTime(
        .001,
        start
      );


      gain.gain.exponentialRampToValueAtTime(
        .075,
        start +
        .03
      );


      gain.gain.exponentialRampToValueAtTime(
        .001,
        start +
        .45
      );


      oscillator.connect(
        gain
      );


      gain.connect(
        audioContext.destination
      );


      oscillator.start(
        start
      );


      oscillator.stop(
        start +
        .5
      );

    }
  );

}


/* =========================================================
   FOOTSTEPS
========================================================= */

function footstep() {

  if (!audioContext)
    return;


  const oscillator =
    audioContext
      .createOscillator();


  const gain =
    audioContext
      .createGain();


  oscillator.type =
    "triangle";


  oscillator.frequency.setValueAtTime(
    90,
    audioContext.currentTime
  );


  oscillator.frequency.exponentialRampToValueAtTime(
    42,
    audioContext.currentTime +
    .08
  );


  gain.gain.setValueAtTime(
    .07,
    audioContext.currentTime
  );


  gain.gain.exponentialRampToValueAtTime(
    .001,
    audioContext.currentTime +
    .1
  );


  oscillator.connect(
    gain
  );


  gain.connect(
    audioContext.destination
  );


  oscillator.start();


  oscillator.stop(
    audioContext.currentTime +
    .11
  );

}


function startFootsteps(
  injured = false
) {

  if (walkingTimer)
    return;


  footstep();


  walkingTimer =
    setInterval(
      footstep,
      injured
        ? 720
        : 400
    );

}


function stopFootsteps() {

  clearInterval(
    walkingTimer
  );


  walkingTimer =
    null;

}


/* =========================================================
   SPLASH SOUND
========================================================= */

function splashSound() {

  if (!audioContext)
    return;


  const duration =
    .3;


  const buffer =
    audioContext.createBuffer(
      1,
      audioContext.sampleRate *
      duration,
      audioContext.sampleRate
    );


  const data =
    buffer.getChannelData(
      0
    );


  for (
    let i = 0;
    i < data.length;
    i++
  ) {

    const fade =
      1 -
      i /
      data.length;


    data[i] =
      (
        Math.random() *
        2 -
        1
      ) *
      fade *
      .18;

  }


  const source =
    audioContext
      .createBufferSource();


  const filter =
    audioContext
      .createBiquadFilter();


  filter.type =
    "lowpass";


  filter.frequency.value =
    1000;


  source.buffer =
    buffer;


  source.connect(
    filter
  );


  filter.connect(
    audioContext.destination
  );


  source.start();

}


/* =========================================================
   CRACK SOUND
========================================================= */

function crackSound() {

  if (!audioContext)
    return;


  const oscillator =
    audioContext
      .createOscillator();


  const gain =
    audioContext
      .createGain();


  oscillator.type =
    "square";


  oscillator.frequency.setValueAtTime(
    140,
    audioContext.currentTime
  );


  oscillator.frequency.exponentialRampToValueAtTime(
    50,
    audioContext.currentTime +
    .16
  );


  gain.gain.setValueAtTime(
    .1,
    audioContext.currentTime
  );


  gain.gain.exponentialRampToValueAtTime(
    .001,
    audioContext.currentTime +
    .2
  );


  oscillator.connect(
    gain
  );


  gain.connect(
    audioContext.destination
  );


  oscillator.start();


  oscillator.stop(
    audioContext.currentTime +
    .22
  );

}


/* =========================================================
   PLUCK SOUND
========================================================= */

function pluckSound() {

  if (!audioContext)
    return;


  const oscillator =
    audioContext
      .createOscillator();


  const gain =
    audioContext
      .createGain();


  oscillator.type =
    "sine";


  oscillator.frequency.setValueAtTime(
    350,
    audioContext.currentTime
  );


  oscillator.frequency.exponentialRampToValueAtTime(
    680,
    audioContext.currentTime +
    .24
  );


  gain.gain.setValueAtTime(
    .12,
    audioContext.currentTime
  );


  gain.gain.exponentialRampToValueAtTime(
    .001,
    audioContext.currentTime +
    .45
  );


  oscillator.connect(
    gain
  );


  gain.connect(
    audioContext.destination
  );


  oscillator.start();


  oscillator.stop(
    audioContext.currentTime +
    .5
  );

}
